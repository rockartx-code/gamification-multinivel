<div class="mt-3 flex flex-col gap-2">
  <ng-container *ngFor="let link of links; let first = first">
    <div *ngIf="link.heading"
      class="flex items-center gap-2 px-2 pb-0.5 text-micro font-bold uppercase tracking-[0.18em] text-gray-500"
      [class.mt-3]="!first">
      <i *ngIf="link.icon" class="fa-solid text-micro text-accent" [ngClass]="link.icon" aria-hidden="true"></i>
      {{ link.label }}
    </div>
    <ui-button *ngIf="!link.heading"
      size="sm"
      [variant]="activeId === link.id ? 'primary' : 'ghost'"
      class="navbtn text-left  w-56"
      (pressed)="onSelect(link.id)">
      <div class="flex items-center gap-2 text-sm font-semibold">
        <i class="fa-solid" [ngClass]="link.icon + ' text-accent'" aria-hidden="true"></i>
        {{ link.label }}
      </div>
      <div *ngIf="link.subtitle" class="mt-0.5 text-xs text-gray-600">{{ link.subtitle }}</div>
    </ui-button>
  </ng-container>
</div>
