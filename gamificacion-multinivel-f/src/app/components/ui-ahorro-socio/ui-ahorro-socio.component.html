<ng-container *ngIf="visible && frase">
  <div *ngIf="variant === 'inline'" class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-main">
    <i class="fa-solid fa-piggy-bank text-gold" aria-hidden="true"></i>
    <span>{{ frase }}</span>
    <a class="font-semibold text-accent hover:underline" [routerLink]="enlace" [queryParams]="enlaceQuery">Conoce el modo socio</a>
  </div>

  <div *ngIf="variant === 'card'" class="rounded-2xl border border-gold-35 bg-gold-12 px-4 py-3">
    <div class="flex items-start gap-3">
      <span class="medallion h-9 w-9 shrink-0 text-sm">
        <i class="fa-solid fa-piggy-bank text-gold" aria-hidden="true"></i>
      </span>
      <div class="min-w-0">
        <div class="text-sm font-semibold text-main">{{ frase }}</div>
        <div class="mt-1 text-xs text-gray-600">
          El modo socio es gratis y no te pide datos extra: descuento por volumen, tu propio código y comisiones por tu red.
        </div>
        <a class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-accent hover:underline" [routerLink]="enlace" [queryParams]="enlaceQuery">
          Conoce el modo socio <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </div>
</ng-container>
