<article
  *ngIf="mode === 'detailed'; else compactCard"
  class="card-lift relative overflow-hidden rounded-3xl border border-olive-30 surface-soft p-4 sm:p-5">

  <div class="flex flex-col gap-4">
    <div class="flex gap-3 sm:gap-4">
      <!-- Imagen -->
      <div class="h-32 w-24 sm:h-40 sm:w-28 shrink-0 overflow-hidden rounded-2xl border border-olive-30 bg-ivory-80">
        <img [src]="product.img" [alt]="product.name" class="h-full w-full object-cover" />
      </div>

      <!-- Contenido -->
      <div class="min-w-0 flex-1 flex flex-col">
        <!-- Precio -->
        <div class="flex justify-end">
          <div class="text-right">
            <div *ngIf="hasDiscount" class="text-micro text-gray-500 line-through">
              {{ originalPriceLabel }}
            </div>
            <div class="text-sm font-extrabold leading-none">
              {{ discountedPriceLabel }}
            </div>
            <div class="text-micro" [ngClass]="hasDiscount ? 'text-accent' : 'text-gray-500'">
              {{ discountLabel }}
            </div>
          </div>
        </div>

        <!-- Puntos Comisionables (PC) que aporta a los logros -->
        <div *ngIf="hasPc" class="mt-1 flex flex-wrap items-center justify-end gap-1.5">
          <!-- Paquete B · ronda 26 (propuesta 23): "PC" aparece trece veces en
               la tienda y su única definición vive en #/modo-socio. Era un
               `title` que nadie abre; ahora es un enlace a la sección que lo
               explica. Enlace plano: la ruta va por hash y así no hace falta
               tocar el componente, que es de otro paquete. -->
          <a href="#/modo-socio#unidades"
             class="inline-flex items-center gap-1 rounded-full bg-accent/10 px-2 py-0.5 text-micro font-bold text-accent underline decoration-dotted"
             title="Qué son los PC y cómo se convierten en descuento y comisiones">
            <i class="fa-solid fa-star text-[9px]" aria-hidden="true"></i>
            {{ officialPc }} PC
          </a>
          <span *ngIf="hasNetPc" class="inline-flex items-center gap-1 rounded-full bg-olive-30/40 px-2 py-0.5 text-micro font-semibold text-gray-700"
                title="PC netos según tu descuento vigente (proporcionales al neto pagado)">
            {{ netPc }} PC netos
          </span>
        </div>

        <!-- Título -->
        <h4 class="mt-2 text-sm sm:text-base font-extrabold leading-snug tracking-tight line-clamp-2">
          {{ product.name }}
        </h4>

        <!-- Descripción -->
        <p class="mt-1 text-xs sm:text-sm text-gray-600 leading-snug line-clamp-3">
          {{ product.description || product.badge }}
        </p>

        <!-- Ver detalle -->
        <button
          type="button"
          class="mt-2 inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-gray-700 underline-offset-2 hover:text-main hover:underline"
          (click)="viewDetails.emit()">
          <i class="fa-solid fa-circle-info text-accent" aria-hidden="true"></i>
          Ver detalle
        </button>
      </div>
    </div>

    <!-- Variantes con selección múltiple y cantidad individual -->
    <div *ngIf="activeVariants.length > 0" class="space-y-2">
      <div
        *ngFor="let variant of activeVariants"
        class="flex items-center justify-between gap-2 rounded-2xl border px-3 py-2 transition"
        [ngClass]="isVariantChecked(variant.id)
          ? 'border-accent/40 bg-accent/5'
          : 'border-olive-30 bg-white/60'">

        <!-- Chip / toggle -->
        <button
          type="button"
          class="flex items-center gap-1.5 text-xs font-medium"
          [ngClass]="isVariantChecked(variant.id) ? 'text-accent' : 'text-gray-600'"
          (click)="toggleVariant(variant.id)">
          <i class="fa-solid text-micro"
            [ngClass]="isVariantChecked(variant.id) ? 'fa-circle-check text-accent' : 'fa-circle text-gray-500'"
            aria-hidden="true"></i>
          {{ variant.name }}
        </button>

        <!-- Qty controls (cuando ya hay unidades o está marcada) -->
        <ui-qty-stepper *ngIf="isVariantChecked(variant.id)"
          [qty]="getVariantQty(variant.id)"
          [itemLabel]="variant.name"
          (qtyChange)="variantQtyChange.emit({ variantId: variant.id, qty: $event })">
        </ui-qty-stepper>

        <!-- Agregado rápido en un tap para variantes sin seleccionar -->
        <button *ngIf="!isVariantChecked(variant.id)"
          type="button"
          [attr.aria-label]="'Agregar ' + variant.name"
          class="inline-flex items-center gap-1.5 rounded-full border border-gold-35 bg-gold-12 px-3 py-1.5 text-xs font-bold text-on-gold transition hover:bg-gold-20"
          (click)="changeVariantQty(variant.id, 1)">
          <i class="fa-solid fa-plus text-micro" aria-hidden="true"></i>
          Agregar
        </button>
      </div>
    </div>

    <!-- Acciones inferiores (solo para productos sin variantes) -->
    <div *ngIf="activeVariants.length === 0" class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 rounded-2xl border border-olive-30 px-3 py-2">
        <span class="text-xs text-gray-600">Qty</span>
        <ui-form-field
          type="number"
          [ngModel]="qty"
          (ngModelChange)="qtyChange.emit(+$event || 0)"
          inputClass="w-14 rounded-xl border border-olive-30 bg-white/70 px-2 py-1 text-sm text-main text-center">
        </ui-form-field>
      </div>

      <ui-button
        size="lg"
        variant="primary"
        class="flex-1"
        (pressed)="add.emit()">
        <i class="fa-solid fa-cart-plus" aria-hidden="true"></i>
        Agregar a carrito
      </ui-button>
    </div>
  </div>
</article>

<ng-template #compactCard>
  <article class="flex min-w-0 items-center gap-3 rounded-2xl border border-olive-30 bg-ivory-80 p-3 overflow-hidden">

    <!-- Imagen -->
    <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-xl border border-olive-30 bg-white">
      <img [src]="product.img" [alt]="product.name" class="h-full w-full object-cover" />
    </div>

    <!-- Info -->
    <div class="min-w-0 flex-1">
      <div class="truncate text-sm font-semibold text-main" [title]="product.name">
        {{ product.name }}
      </div>

      <div class="text-xs text-gray-500 truncate">
        {{ product.badge }}
      </div>

      <div class="mt-1 flex items-center gap-2">
        <span class="text-sm font-extrabold">{{ discountedPriceLabel }}</span>
        <span *ngIf="hasPc" class="inline-flex items-center gap-1 rounded-full bg-accent/10 px-1.5 py-0.5 text-micro font-bold text-accent"
              title="Puntos Comisionables que suma a tus logros (PV/PG)">
          <i class="fa-solid fa-star text-[8px]" aria-hidden="true"></i>{{ officialPc }} PC
        </span>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex items-center gap-1 shrink-0">
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-full text-gray-600 hover:bg-black/5"
        [attr.aria-label]="'Ver detalle de ' + product.name"
        (click)="viewDetails.emit()">
        <i class="fa-solid fa-circle-info text-xs" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-full bg-accent text-white hover:opacity-90"
        [attr.aria-label]="'Agregar ' + product.name + ' al carrito'"
        (click)="add.emit()">
        <i class="fa-solid fa-cart-plus text-xs" aria-hidden="true"></i>
      </button>
    </div>
  </article>
</ng-template>
