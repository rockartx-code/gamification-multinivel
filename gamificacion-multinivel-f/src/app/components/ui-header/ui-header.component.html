<header [class]="headerClass">
  <div [class]="containerClass">
    <div class="flex min-w-0 items-center gap-3">
      <img src="Logo-sin_slogan.svg" width="320" height="96" alt="Logo findingU" [class]="desktopLogoClass" />
      <img *ngIf="showMiniLogo" src="logo-U.svg" width="64" height="64" alt="Logo" class="h-7 w-7 md:hidden" />
      <ng-content select="[header-left]"></ng-content>
    </div>

    <!-- Sin shrink-0: en Admin móvil, el grupo header-left (logo + hamburguesa) y este grupo
         (Acciones/Logout/Nuevo, con un ancho mínimo forzado) suman más que el viewport; con
         shrink-0 aquí, TODO el encogimiento recaía sobre header-left, cuyo botón terminaba
         desbordando su caja y pintándose encima de "Acciones" (ver
         docs/ux/analisis-ui-ux-2026-08.md, hallazgo Alta "navegación admin en móvil"). Con
         flex-wrap, este grupo pasa a una segunda línea en vez de forzar el colapso del otro. -->
    <div class="flex flex-wrap items-center justify-end gap-2">
      <ng-content></ng-content>
    </div>
  </div>
</header>
