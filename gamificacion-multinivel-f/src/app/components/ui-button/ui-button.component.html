<button
  [attr.type]="type"
  [disabled]="disabled"
  [class]="classes"
  [routerLink]="routerLink"
  [attr.aria-label]="ariaLabel || null"
  [attr.title]="reasonTitle"
  [attr.aria-disabled]="disabled ? 'true' : null"
  (click)="onClick($event)"
>
  <i *ngIf="iconClass" [class]="iconClass" aria-hidden="true"></i>

  <span class="btn-content" [class.stacked]="stacked">
    <!-- Modo normal -->
    <ng-content *ngIf="!stacked"></ng-content>

    <!-- Modo stacked -->
    <span class="btn-title" *ngIf="stacked">
      <ng-content select="[btnTitle]"></ng-content>
    </span>

    <span class="btn-subtitle" *ngIf="stacked">
      <ng-content select="[btnSubtitle]"></ng-content>
    </span>
  </span>
</button>

<!-- Motivo del bloqueo: visible solo mientras el botón está deshabilitado -->
<span *ngIf="hasReason" class="btn-reason" role="note">{{ disabledReason }}</span>
