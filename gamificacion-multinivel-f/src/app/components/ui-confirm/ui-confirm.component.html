<ui-modal [isOpen]="isOpen" maxWidthClass="max-w-md" contentClass="p-6" [closeOnBackdrop]="!busy" [ariaLabel]="title" (closed)="result ? finish() : cancel()">
  <ng-container *ngIf="!result; else listo">
    <div class="text-lg font-extrabold text-main">{{ title }}</div>

    <div *ngIf="effect" class="mt-3 rounded-2xl border px-4 py-3 text-sm"
      [ngClass]="danger ? 'border-red-200 bg-red-50 text-red-900' : 'border-amber-200 bg-amber-50 text-amber-900'">
      <div class="font-semibold">Qué va a pasar</div>
      <p class="mt-1">{{ effect }}</p>
    </div>

    <!-- Campos adicionales de quien monta el diálogo (cantidades, opciones) -->
    <ng-content></ng-content>

    <div *ngIf="requireReason" class="mt-4">
      <ui-form-field
        kind="textarea"
        [rows]="2"
        [label]="reasonLabel"
        [placeholder]="reasonPlaceholder"
        [ngModel]="reason"
        (ngModelChange)="reason = $event">
      </ui-form-field>
    </div>

    <div *ngIf="error" class="mt-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>

    <div class="mt-5 flex flex-col items-end gap-1">
      <div class="flex gap-2">
        <ui-button size="sm" variant="ghost" [disabled]="busy" (pressed)="cancel()">{{ cancelLabel }}</ui-button>
        <ui-button size="sm" variant="primary" [disabled]="!!disabledReason" [disabledReason]="disabledReason" (pressed)="confirm()">
          {{ busy ? busyLabel : confirmLabel }}
        </ui-button>
      </div>
    </div>
  </ng-container>

  <ng-template #listo>
    <div class="text-lg font-extrabold text-main">{{ resultTitle }}</div>
    <div class="mt-3 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900">{{ result }}</div>
    <div class="mt-5 flex justify-end">
      <ui-button size="sm" variant="primary" (pressed)="finish()">Listo</ui-button>
    </div>
  </ng-template>
</ui-modal>
