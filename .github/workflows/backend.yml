name: Backend

on:
  push:
    paths: ['Micro-lambda-GMF/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['Micro-lambda-GMF/**', '.github/workflows/backend.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Micro-lambda-GMF/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Micro-lambda-GMF/python/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Análisis estático
        # pyflakes detecta nombres no definidos: así se descubrió que
        # auth_utils.migrate() reventaba con NameError al ejecutarse.
        run: python -m pyflakes .

      - name: Pruebas
        run: python -m pytest tests -q

      - name: Validar la plantilla de infraestructura
        # `sam validate` requiere credenciales; aquí basta con comprobar que el
        # YAML es válido. Las pruebas de tests/test_infraestructura.py son las
        # que verifican que la plantilla concuerde con el código.
        run: |
          python - <<'EOF'
          import yaml
          L = type('L', (yaml.SafeLoader,), {})
          L.add_multi_constructor('!', lambda *a: None)
          with open('../template.yaml', encoding='utf-8') as f:
              yaml.load(f, Loader=L)
          print('template.yaml valido')
          EOF

      - name: Presupuesto de consultas a DynamoDB
        # El coste de los endpoints no debe crecer con el tamaño del dataset.
        run: python tools/check_query_budget.py
