        | GET    | /orders/{orderId}/status | público | — | ✅ |
        | POST   | /orders/{orderId}/checkout | auth | `{successUrl?, failureUrl?}` | ✅ |
        | POST   | /orders/{orderId}/cancel | auth | `{reason}` | ✅ |
        | POST   | /orders/{orderId}/return | auth | `OrderReturnRequestPayload` | ⚠️ pendiente |
        | POST   | /orders/{orderId}/refund | admin | `{reason?}` | ✅ |
      operationId: ordersProxy
