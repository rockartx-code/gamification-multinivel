    post:
      summary: "Completa tu activación: producto más barato que cierra los VP que faltan"
      description: "Privilegio: sesión propia (customerId del cuerpo debe ser el del actor; admin puede consultar cualquiera). Cuerpo {customerId, items:[{productId, quantity, price}], couponCode?}."
      operationId: checkoutSugerenciaActivacion
      tags: [Orders]
      security:
        - UserSession: []
      responses:
        "200":
          description: "OK"
        "401":
          description: "Sin sesión"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy-path
    options:
      <<: *cors-options

  /orders/checkout/sucursales-recoger:
    post:
      summary: "Sucursales donde se puede recoger en la ciudad/estado del cliente y con existencia"
      description: "Público. Cuerpo {city?, state?, postalCode?, items:[{productId, quantity}]}. Respuesta {available, locationGiven, cities, stocks:[{id, name, location, city, state, inArea, canPickup, missing}]}."
      operationId: checkoutSucursalesRecoger
      tags: [Orders]
      security: []
      responses:
        "200":
          description: "OK"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy-path
    options:
      <<: *cors-options

  /orders/{orderId}/factura:
    post:
      summary: "Quiero factura: guarda los datos fiscales y deja el pedido en 'solicitada'"
      description: "Privilegio: dueño del pedido, invitado por folio, o admin. Cuerpo {rfc, razonSocial, regimenFiscal, cpFiscal, usoCfdi, email}. 400 RFC inválido; 409 pedido cancelado/reembolsado o factura ya emitida."
      operationId: orderSolicitarFactura
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/proxyPath'
      responses:
        "200":
          description: "OK"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy-path
    options:
      <<: *cors-options

  /orders/{orderId}/factura/emitida:
    post:
      summary: "Marcar factura emitida (archivo opcional)"
      description: "Privilegio: order_mark_paid. Cuerpo {folioFiscal?, name?, contentType?, contentBase64?}. 409 si el pedido no tiene solicitud pendiente."
      operationId: orderFacturaEmitida
      tags: [Orders]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/proxyPath'
      responses:
        "200":
          description: "OK"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy-path
    options:
      <<: *cors-options

  /auth/enlace-acceso:
    post:
      summary: "Enlace de acceso por correo (un solo uso, 15 minutos)"
      description: "Pública. Cuerpo {email, rememberMe?}. Nunca revela si el correo existe."
      operationId: authEnlaceAcceso
      tags: [Auth]
      security: []
      responses:
        "200":
          description: "OK"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy-path
    options:
      <<: *cors-options

  /auth/enlace-acceso/canjear:
    post:
      summary: "Canjear el enlace de acceso y abrir sesión"
      description: "Pública. Cuerpo {token, rememberMe?}. Responde como /auth/login; 401 si el enlace es inválido, usado o caducado."
      operationId: authEnlaceAccesoCanjear
      tags: [Auth]
      security: []
      responses:
        "200":
          description: "OK"
        "401":
          description: "Enlace inválido, usado o caducado"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy-path
    options:
      <<: *cors-options

  # ════════════════════════════════════════════════════════════
  # ── Paquete D · almacén, despacho y paquetería ──
  # Rutas atendidas por inventory_lambda (despacho_handlers.atender).
  # ════════════════════════════════════════════════════════════
  /inventory/despacho/pendientes:
    get:
      summary: "Pedidos pagados a domicilio listos para despachar y enviados sin entrega"
      description: "Privilegio: order_mark_shipped. Query: stockId (informativo)."
      operationId: despachoPendientes
      tags: [Inventory]
      responses:
        "200":
          description: "{orders[], staleShipped[], carrierIntegration}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/despacho/surtido:
    post:
      summary: "Lista de surtido consolidada por producto contra la bodega, con semáforo"
      description: "Privilegio: order_mark_shipped. Body: {stockId, orderIds[]}. 400 sin pedidos; 404 bodega."
      operationId: despachoSurtido
      tags: [Inventory]
      responses:
        "200":
          description: "{stockId, canDispatch, lines[], reasons[], blockedOrders[]}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/despacho/enviar:
    post:
      summary: "Despacho en bloque: marca como enviados con guía capturada, CSV o generada"
      description: "Privilegio: order_mark_shipped. Body: {stockId, shipments[], csv?, generateLabels?}. 409 STOCK_SHORT si el surtido no alcanza."
      operationId: despachoEnviar
      tags: [Inventory]
      responses:
        "200":
          description: "{batchId, shipped[], failed[]}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/despacho/preferencias:
    get:
      summary: "Bodega por defecto del empleado con sesión"
      description: "Sesión de empleado. 401 sin sesión."
      operationId: despachoPreferenciasGet
      tags: [Inventory]
      responses:
        "200":
          description: "{defaultStockId, stockName}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    put:
      summary: "Guarda la bodega por defecto del empleado"
      description: "Sesión de empleado. Body: {defaultStockId}. 404 bodega."
      operationId: despachoPreferenciasPut
      tags: [Inventory]
      responses:
        "200":
          description: "{defaultStockId, stockName}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/envios/rastrear:
    post:
      summary: "Tarea programable: consulta la paquetería y marca entregados con fecha y firma"
      description: "Privilegio: order_mark_delivered o token de superadmin. Body: {orderIds?, dryRun?}. Idempotente por día."
      operationId: enviosRastrear
      tags: [Shipping]
      responses:
        "200":
          description: "{checked, delivered[], inTransit[], errors[]}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/envios/cerrar:
    post:
      summary: "Tarea programable: correo '¿te llegó?' a los askDays y cierre automático a los autoCloseDays"
      description: "Privilegio: order_mark_delivered o token de superadmin. Body: {dryRun?}. Idempotente por día."
      operationId: enviosCerrar
      tags: [Shipping]
      responses:
        "200":
          description: "{asked[], closed[]}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/envios/{orderId}/confirmar-entrega:
    get:
      summary: "Enlace del correo '¿te llegó?': el cliente confirma la entrega (página HTML)"
      description: "Pública con ?token= de un solo uso. 401 token inválido."
      operationId: enviosConfirmarEntregaGet
      tags: [Shipping]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Página de confirmación"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    post:
      summary: "Confirmación de entrega por el cliente (JSON)"
      description: "Pública con ?token= de un solo uso. 401 token inválido."
      operationId: enviosConfirmarEntregaPost
      tags: [Shipping]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status: delivered}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /inventory/turno/resumen:
    get:
      summary: "Resumen automático de turno por empleado y fecha, calculado desde la bitácora"
      description: "Privilegio: access_screen_stats, o el propio usuario. Query: userId, date=YYYY-MM-DD."
      operationId: turnoResumen
      tags: [Inventory]
      responses:
        "200":
          description: "{user, date, dispatched[], delivered[], transfers, entries[], damages[], pos, counters, text}"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  # ── Paquete E · caja-arqueo ──
  /pos/arqueo:
    get:
      summary: "Arqueo de caja: efectivo esperado y movimientos desde el último corte"
      description: "Privilegio `pos_register_sale`. Fondo del corte anterior + ventas en efectivo + abonos en efectivo + parte en efectivo de pagos mixtos − retiros sin corte. Sin `stockId` usa la sucursal ligada al usuario."
      operationId: posArqueo
      tags: [POS]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
        - name: stockId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Arqueo calculado"
        "400":
          description: "Sin sucursal vinculada"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /pos/cash-cuts/{id}:
    get:
      summary: "Comprobante de un corte de caja"
      description: "Privilegio `pos_register_sale`. Devuelve el corte completo (esperado, contado, diferencia, fondo, retiro, ventas y retiros)."
      operationId: posGetCashCut
      tags: [POS]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Corte"
        "404":
          description: "No existe"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /pos/cash-cuts/{id}/enviar:
    post:
      summary: "Enviar el comprobante del corte por correo a la gerente"
      description: "Privilegio `pos_register_sale`. Usa `email` del cuerpo o `pos.cashCutNotifyEmail` de la configuración; 400 si no hay ninguno."
      operationId: posSendCashCut
      tags: [POS]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        "200":
          description: "Enviado"
        "400":
          description: "Sin correo configurado"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  # ── Paquete F · coach-seguimiento (propuestas 15 y 19) ─────────────────────
  /customers/seguimiento/hoy:
    get:
      summary: "Seguimiento de hoy: clientes priorizados por situación para la coach"
      description: |
        Privilegio `access_screen_customers`. Una fila por persona (clientes e invitados sin ficha)
        con teléfono, enlace wa.me, patrocinadora, ejecutiva asignada, origen, último pedido,
        días sin compra, días sin contacto, situación (`bienvenida|fria|clabe_pendiente|pedido_tardio|activa`)
        y prioridad. Excluye "no contactar", bajas y, en `scope=mine`, las de otra ejecutiva.
        Query: `scope=mine|all` (mine por omisión), `situation=`, `limit=`.
      operationId: seguimientoHoy
      tags: [Customers]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
      responses:
        "200":
          description: "Lista priorizada"
        "403":
          description: "Sin el privilegio de Clientes"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /customers/seguimiento/plantillas:
    get:
      summary: "Plantillas de WhatsApp por situación"
      description: |
        Privilegio `access_screen_customers`. Devuelve `templates` (bienvenida, fria, clabe_pendiente,
        pedido_tardio) y `placeholders` ({nombre}, {coach}, {producto}, {monto}, {folio}). Las
        plantillas viven en código y se sobreescriben por clave con la config `seguimiento.templates`.
      operationId: seguimientoPlantillas
      tags: [Customers]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
      responses:
        "200":
          description: "Plantillas"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /customers/seguimiento/ficha-invitado:
    post:
      summary: "Crea la ficha de un comprador invitado y le liga sus pedidos"
      description: |
        Privilegio `access_screen_customers`. Cuerpo `{email}`. Crea el cliente en modo cliente,
        origen `invitado`, sin acceso; liga los pedidos hechos con ese correo y migra las notas de
        `GUEST_CONTACT`. 409 si el correo ya tiene ficha; 404 si no hay pedidos de invitado.
      operationId: seguimientoFichaInvitado
      tags: [Customers]
      security:
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
      responses:
        "201":
          description: "Ficha creada"
        "409":
          description: "El correo ya tiene ficha"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  /customers/{customerId}/contacto:
    post:
      summary: "Anota un contacto (WhatsApp, correo o llamada) y devuelve el enlace wa.me prellenado"
      description: |
        Privilegio `access_screen_customers`. Cuerpo `{channel: whatsapp|email|call, templateKey?, message, guestEmail?}`.
        Añade la nota a `contactNotes` con canal, plantilla y hora y actualiza `lastContactAt`.
        Con `customerId = "invitado"` y `guestEmail` la nota se guarda en `GUEST_CONTACT`.
        409 `doNotContact` si la persona pidió que no se le escriba.
      operationId: seguimientoContacto
      tags: [Customers]
      security:
        - UserSession: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
      responses:
        "201":
          description: "Nota registrada"
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: "No contactar"
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

  # ── Paquete G · devoluciones ──────────────────────────────────────────────
  /orders/{orderId}/devolucion:
    get:
      summary: "Solicitud de devolución de un pedido: líneas devueltas, evidencia, reembolso sugerido, política (medio y plazo) y estado"
      description: |
        Privilegio: dueño del pedido (sesión), invitado (pedido sin cuenta, sin sesión) o admin/empleado.
        Responde `{request: {requestId, status, motivo, lines, evidence, refund, inspection?, refundedAt?, refundAmount?, createdAt}}`;
        404 `RETURN_NOT_FOUND` si el pedido no tiene solicitud.
      operationId: getOrderReturnRequest
      tags: [Orders]
      security:
        - UserSession: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/xUserId'
        - $ref: '#/components/parameters/xUserRole'
      responses:
        "200":
          description: "Solicitud de devolución del pedido"
        "404":
          $ref: '#/components/responses/NotFound'
      x-amazon-apigateway-integration:
        <<: *lambda-proxy
    options:
      <<: *cors-options

# ─── Tags ──────────────────────────────────────────────────────────────────────
tags:
  - name: Auth
    description: "Autenticación, registro y gestión de contraseñas"
  - name: Customers
    description: "Gestión de distribuidores/clientes y perfiles"
  - name: Admin
    description: "Panel de control administrativo"
  - name: Products
    description: "Catálogo de productos y variantes"
  - name: Categories
    description: "Categorías de productos"
  - name: Campaigns
    description: "Campañas de marketing y materiales"
  - name: Notifications
    description: "Notificaciones del portal"
  - name: Orders
    description: "Órdenes de venta, pagos y devoluciones"
  - name: Commissions
    description: "Comisiones, bonos y retiros"
  - name: Network
    description: "Red multinivel — árbol de distribuidores"
  - name: Dashboard
    description: "Dashboard del distribuidor, carrito y tablero de honor"
  - name: Config
    description: "Configuración de negocio — bonos, rangos, VP/VG"
  - name: Assets
    description: "Archivos e imágenes (S3 pre-signed URLs)"
  - name: Inventory
    description: "Almacenes, entradas, mermas y traspasos"
  - name: POS
    description: "Punto de venta presencial"
  - name: Shipping
    description: "Cotización de envíos"
  - name: Employees
    description: "Gestión de empleados y privilegios"
  - name: Webhooks
    description: "Callbacks de integraciones externas (MercadoLibre)"
  - name: CORS
    description: "Preflight CORS (generados automáticamente)"
