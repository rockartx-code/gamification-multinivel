AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Backend de la plataforma de gamificación multinivel Finding'U.

  Esta plantilla declara la infraestructura que hasta ahora solo existía en la
  consola de AWS: la tabla, su TTL, las 8 funciones Lambda con sus handlers y
  variables, la layer común y la máquina de estados. Mientras la
  infraestructura no fuera código, tres pendientes de seguridad —habilitar el
  TTL, rotar el token de superadmin y corregir el handler de clientes— no se
  podían hacer ni revisar desde el repositorio.

  IMPORTANTE: está derivada del código y del OpenAPI, no exportada de la cuenta
  en producción. Antes del primer `sam deploy` sobre un entorno existente hay
  que contrastarla con lo desplegado (ver docs/qa/08-infraestructura.md).

Parameters:
  Entorno:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Sufijo de los recursos y del stack.

  NombreTabla:
    Type: String
    Default: multinivel
    Description: Tabla DynamoDB única (patrón single-table).

  BucketVentas:
    Type: String
    Default: findingu-ventas
    Description: Bucket S3 de assets y comprobantes.

  TokenSuperadmin:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Token maestro con todos los privilegios. Dejar VACÍO desactiva el acceso
      de superadmin, que es lo recomendado en producción. El valor histórico
      estaba escrito en el código fuente y debe considerarse comprometido.

  UrlFrontend:
    Type: String
    Default: https://www.findingu.com.mx

  CorreoRemitente:
    Type: String
    Default: info@findingu.com.mx
    Description: Remitente verificado en SES.

  UrlApiEnvios:
    Type: String
    Default: https://api-test.envia.com/ship/rate/
    Description: En producción, apuntar al endpoint de producción de Envia.

  ClaveApiEnvios:
    Type: String
    Default: ""
    NoEcho: true

  TokenMercadoPago:
    Type: String
    Default: ""
    NoEcho: true
    Description: Token de acceso de Mercado Pago para el checkout.

  BaseDatosAthena:
    Type: String
    Default: ""
    Description: Base de datos de Athena para el sync analítico (opcional).

Conditions:
  EsProduccion: !Equals [!Ref Entorno, prod]

Globals:
  # Cada función empaqueta `python/` completo, que ya trae el paquete `core/`.
  # No se declara una layer a propósito: obligaría a mantener el mismo código
  # en dos artefactos que pueden desincronizarse, y boto3 ya viene en el
  # runtime. Los comentarios "Importado desde la Lambda Layer" del código son
  # históricos; el import funciona igual empaquetado.
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref TablaMultinivel
        BUCKET_NAME: !Ref BucketVentas
        FRONTEND_BASE_URL: !Ref UrlFrontend
        SES_FROM_EMAIL: !Ref CorreoRemitente
        SUPERADMIN_TOKEN: !Ref TokenSuperadmin
        APP_CONFIG_TTL_SECONDS: "60"
        SESSION_TTL_SECONDS: "2592000"
        PASSWORD_HASH_ITERATIONS: "210000"
        # DEMO_LOGIN_ENABLED se omite a propósito: sin definir, no existen
        # cuentas de demostración.
    Tracing: Active

Resources:
  # ── Datos ──────────────────────────────────────────────────────────────────
  TablaMultinivel:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${NombreTabla}-${Entorno}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # El código ya escribe el atributo `ttl` (epoch) en las sesiones; sin
      # esta especificación nada se purgaba y la partición SESSION crecía sin
      # techo, junto con sus punteros REF.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [EsProduccion, true, false]
      StreamSpecification:
        # Habilitado para el paso siguiente del roadmap: mantener el árbol de
        # red de forma incremental en vez de reconstruirlo dentro de un GET.
        StreamViewType: NEW_AND_OLD_IMAGES

  # ── Funciones ──────────────────────────────────────────────────────────────
  FnAuth:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-auth-${Entorno}"
      CodeUri: python/
      Handler: auth_utils.lambda_handler
      Policies: [!Ref PoliticaTabla, !Ref PoliticaCorreo]
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/auth/{proxy+}"
            Method: ANY

  FnCatalogo:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-catalog-${Entorno}"
      CodeUri: python/
      Handler: catalog_lambda.lambda_handler
      Policies: [!Ref PoliticaTabla, !Ref PoliticaBucket]
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/catalog/{proxy+}"
            Method: ANY

  FnClientes:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-customers-${Entorno}"
      CodeUri: python/
      # El typo histórico (`costumer`) queda resuelto aquí: el módulo real es
      # `customer_lambda`. `costumer_lambda.py` sigue en el repo como puente
      # por si algún despliegue todavía apunta al nombre viejo.
      Handler: customer_lambda.lambda_handler
      Policies: [!Ref PoliticaTabla, !Ref PoliticaBucket, !Ref PoliticaCorreo]
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/customers/{proxy+}"
            Method: ANY

  FnComisiones:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-commissions-${Entorno}"
      CodeUri: python/
      Handler: commissions_lambda.lambda_handler
      Timeout: 120                     # motor de comisiones y bonos
      MemorySize: 1024
      Policies: [!Ref PoliticaTabla, !Ref PoliticaBucket]
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/commissions/{proxy+}"
            Method: ANY

  FnPedidos:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-orders-${Entorno}"
      CodeUri: python/
      Handler: order_lambda.lambda_handler
      Policies:
        - !Ref PoliticaTabla
        - !Ref PoliticaBucket
        - !Ref PoliticaCorreo
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref MaquinaVentas
      Environment:
        Variables:
          ORDER_FULFILLMENT_SFN_ARN: !Ref MaquinaVentas
          MERCADOPAGO_ACCESS_TOKEN: !Ref TokenMercadoPago
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/orders/{proxy+}"
            Method: ANY

  FnInventario:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-inventory-${Entorno}"
      CodeUri: python/
      Handler: inventory_lambda.lambda_handler
      Policies:
        - !Ref PoliticaTabla
        - !Ref PoliticaBucket
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref MaquinaVentas
      Environment:
        Variables:
          ORDER_FULFILLMENT_SFN_ARN: !Ref MaquinaVentas
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/inventory/{proxy+}"
            Method: ANY

  FnDashboard:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-dashboard-${Entorno}"
      CodeUri: python/
      Handler: dashboard_lambda.lambda_handler
      Timeout: 60                      # cuadro de honor sobre toda la red
      MemorySize: 1024
      Policies: [!Ref PoliticaTabla, !Ref PoliticaBucket, !Ref PoliticaCorreo]
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref BaseDatosAthena
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/dashboard/{proxy+}"
            Method: ANY

  FnEnvios:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "multinivel-shipping-${Entorno}"
      CodeUri: python/
      Handler: shipping_lambda.lambda_handler
      Policies: [!Ref PoliticaTabla]
      Environment:
        Variables:
          ENVIA_API_URL: !Ref UrlApiEnvios
          ENVIA_API_KEY: !Ref ClaveApiEnvios
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiPublica
            Path: "/shipping/{proxy+}"
            Method: ANY

  # ── API ────────────────────────────────────────────────────────────────────
  ApiPublica:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "multinivel-api-${Entorno}"
      StageName: !Ref Entorno
      TracingEnabled: true
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-User-Id,X-User-Name,X-User-Role'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: "*"
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100

  # ── Orquestación de ventas ─────────────────────────────────────────────────
  MaquinaVentas:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "multinivel-ventas-${Entorno}"
      DefinitionUri: python/stepFunctions.json
      DefinitionSubstitutions:
        CommissionsFunctionArn: !GetAtt FnComisiones.Arn
        DashboardFunctionArn: !GetAtt FnDashboard.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FnComisiones
        - LambdaInvokePolicy:
            FunctionName: !Ref FnDashboard

  # ── Políticas compartidas ──────────────────────────────────────────────────
  PoliticaTabla:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:TransactWriteItems
            # La lista NO incluye el permiso de barrido completo de tabla: el
            # backend no hace ninguno y no debe empezar por accidente.
            Resource:
              - !GetAtt TablaMultinivel.Arn
              - !Sub "${TablaMultinivel.Arn}/index/*"

  PoliticaBucket:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:PutObjectAcl]
            Resource: !Sub "arn:aws:s3:::${BucketVentas}/*"

  PoliticaCorreo:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource: "*"

Outputs:
  UrlApi:
    Description: URL base del API.
    Value: !Sub "https://${ApiPublica}.execute-api.${AWS::Region}.amazonaws.com/${Entorno}"
  NombreTabla:
    Value: !Ref TablaMultinivel
  ArnMaquinaVentas:
    Value: !Ref MaquinaVentas
